# Reels diário, de graça: filma a animação do dia (página do site) com
# Playwright, monta o MP4 com ffmpeg, sobe no Supabase Storage e pede pro site
# publicar como Reels. Tudo em scripts/reels/gerar.mjs.
#
# Secret do repositório: CRON_SECRET (o mesmo da Vercel).
# Variável do repositório: SITE_URL (ex.: https://intuitiveconcept.com.br).
# Só roda de verdade com SOCIAL_REELS=on na Vercel; senão, o site responde
# "nada a fazer" e o job termina em segundos.
# Com SOCIAL_REELS_NARRADO=on, o Reels é o NARRADO (30–40s, ElevenLabs); se o
# narrado falhar, sai o card de 9s. Rodar à mão com previa=sim gera o vídeo
# narrado de um dia (AAAA-MM-DD-previa.mp4 no bucket) sem publicar: aparece
# em /api/social/previa.
# Com SOCIAL_REELS_INTERATIVO=on, nos dias de carta (ter, sáb), pausa (qua) e
# número (seg) o Reels é o INTERATIVO; nos outros, o narrado. Falha no
# interativo = narrado; falha no narrado = card. Na prévia, `formato` escolhe
# qual filmar (vazio = o do dia). Com SOCIAL_FRASE_DO_DIA=on, a sexta é a
# "Frase do dia" (a voz lê a frase da tabela fixa, o "Hoje, …" e a chamada).
# Quem dispara de verdade é o site (nov/2026): o cron de hora em hora
# (/api/cron/social-hora, cron-job.org) chama o workflow_dispatch a partir das
# 7h se o Reels do dia ainda não saiu (GITHUB_TOKEN_REELS na Vercel; ver
# lib/githubActions.js). O `schedule` abaixo ficou de reserva: o agendamento do
# GitHub atrasava horas ou não rodava.
name: Reels diário

on:
  schedule:
    # Horário em UTC. O GitHub atrasa agendamentos em até ~1h nos horários cheios.
    - cron: '17 10 * * *'   # 7h17 de Brasília
    - cron: '17 14 * * *'   # 11h17: repescagem (sai na hora se o de manhã já publicou)
  workflow_dispatch:
    inputs:
      data:
        description: 'Dia (AAAA-MM-DD). Vazio = hoje em Brasília.'
        required: false
        default: ''
      previa:
        description: 'Prévia do Reels narrado? (sim = gera o vídeo e NÃO publica)'
        required: false
        default: 'nao'
        type: choice
        options: ['nao', 'sim']
      formato:
        description: 'Só na prévia: qual formato filmar (vazio = o do dia)'
        required: false
        default: ''
        type: choice
        options: ['', 'carta', 'pausa', 'numero', 'frase', 'narrado']

concurrency:
  group: reels-diario
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/reels/package-lock.json

      - name: Dependências (Playwright)
        working-directory: scripts/reels
        run: npm ci --no-audit --no-fund

      - name: Chromium
        working-directory: scripts/reels
        run: npx playwright install --with-deps chromium

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Gerar e publicar o Reels
        working-directory: scripts/reels
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATA: ${{ inputs.data }}
          PREVIA: ${{ inputs.previa }}
          FORMATO: ${{ inputs.formato }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON gerar.mjs
