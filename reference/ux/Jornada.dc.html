<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jornada da cliente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2c77b}a:hover{color:#ffdca0}
</style>
</helmet>
<div style="width: 1280px; height: 640px; box-sizing: border-box; padding: 56px 64px; background: #07040d; color: #f3e9da; font-family: Geist, sans-serif; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <p style="font-family: 'Geist Mono', monospace; margin: 0; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #f2c77b">Jornada da cliente</p>
    <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 46px; line-height: 1.05">Cada passo tem uma página e um único objetivo</h1>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px; border: 1px solid #3a2c55; border-radius: 16px; background: #140b22; min-height: 340px">
        <span style="font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1; color: #f2c77b">{{s.n}}</span>
        <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 26px; font-weight: 600">{{s.title}}</h2>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #9e8cbd">Página</span>
          <span style="font-size: 14px; line-height: 1.45">{{s.page}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #9e8cbd">Objetivo</span>
          <span style="font-size: 14px; line-height: 1.45">{{s.goal}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: auto">
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #9e8cbd">Número que mede</span>
          <span style="font-size: 14px; line-height: 1.45; color: #ffdca0">{{s.metric}}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <p style="margin: 0; font-size: 14px; color: #c9b8a6">Hoje o gargalo está no passo 1: quase ninguém chega. Melhorar os passos 3 a 5 antes de resolver o 1 não muda o faturamento.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { steps: [
{ n: '1', title: 'Chega', page: 'Reel, Pinterest ou Google → /ceu ou uma página grátis', goal: 'Curiosidade em 3 segundos', metric: 'Visitas por dia' },
{ n: '2', title: 'Se encanta', page: 'Resultado grátis (céu, anjo, Kin…)', goal: 'O “uau”: algo único dela', metric: '% que chega ao resultado' },
{ n: '3', title: 'Se identifica', page: 'Quiz curto → prévia grátis', goal: 'Sentir que o mapa fala dela', metric: '% que termina o quiz' },
{ n: '4', title: 'Compra', page: 'Prévia → Manual', goal: 'Uma oferta, um botão', metric: '% da prévia que compra' },
{ n: '5', title: 'Volta', page: 'Minha Área (Seu Dia)', goal: 'Hábito diário → assinatura', metric: 'Retorno em 7 dias' }
] };
}
}
</script>
</body>
</html>
