<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Esta é você?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffdca0}a:hover{color:#fff1d6}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07040d; color: #f3e9da; font-family: Geist, sans-serif">
  <img src="/olho/e1.webp" alt="" style="position: absolute; left: 0; top: -40px; width: 100%; height: 460px; object-fit: cover; object-position: center 45%; opacity: .75">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 440px; background: linear-gradient(180deg, rgba(7,4,13,.4) 0%, rgba(7,4,13,0) 30%, rgba(7,4,13,.85) 80%, #07040d 100%)"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 22px 24px 28px">
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .28em; text-transform: uppercase">Intuitive Concept</span>

    <div style="margin-top: 230px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: #ffdca0">Primeiro acesso</span>
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 60px; line-height: .9">Esta é <i style="color: #ffdca0">você?</i></h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #b9a9c9; font-weight: 300">Seu mapa inteiro sai destes dados. Confira uma vez e pronto.</p>
    </div>

    <div style="margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid rgba(242,199,123,.2)">
      <sc-for list="{{dados}}" as="d" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-bottom: 1px solid rgba(242,199,123,.2)">
          <span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #b9a9c9">{{d.k}}</span>
          <span style="font-family: 'Instrument Serif', serif; font-size: 24px">{{d.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="min-height: 54px; border: 0; border-radius: 999px; background: #f2c77b; color: #1a1020; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase">Sim, sou eu</button>
      <button type="button" style="min-height: 50px; border: 1px solid rgba(243,233,218,.25); border-radius: 999px; background: transparent; color: #f3e9da; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase">Corrigir meus dados</button>
      <p style="margin: 6px 0 0; font-family: 'Geist Mono', monospace; font-size: 10px; line-height: 1.6; color: #8d7fa3; text-align: center">Leituras de outras pessoas neste e-mail ficam guardadas, fechadas, no fim da Minha Área.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { dados: [
{ k: 'Nome', v: 'Bianca' }, { k: 'Nascimento', v: '21/12/1994' },
{ k: 'Hora', v: '07:25' }, { k: 'Cidade', v: 'Vitória, ES' }
] };
}
}
</script>
</body>
</html>
